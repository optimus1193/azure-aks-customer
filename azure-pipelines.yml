# Runs on every commit to main that changes environments/ or this file. All provisioning logic runs in azure-aks-platform.
#
# Plan stage: always (commits, pull requests, manual runs).
# Then, on main, `mode` in environments/<env>/config.yaml decides:
#   mode: create   Apply_<env>, after approval on the ADO environment "<env>"
#   mode: destroy  Destroy_<env>, after a manual confirmation and approval on the ADO environment "<env>-destroy"

trigger:
  batch: true # one run at a time per branch; commits that land during a run are picked up by the next one
  branches:
    include: [main]
  paths:
    include:
      - environments
      - azure-pipelines.yml

# Used when this repo is on GitHub. Azure Repos ignores it: add a Build Validation branch policy on main instead.
pr:
  branches:
    include: [main]
  paths:
    include:
      - environments
      - azure-pipelines.yml

parameters:
  - name: planOnly
    displayName: Plan only (never apply or destroy)
    type: boolean
    default: false

resources:
  repositories:
    - repository: platform # provision.yml expects this alias
      type: git # Azure Repos. For GitHub: type: github, endpoint: <GitHub service connection>, name: my-org/azure-aks-platform
      name: Platform/azure-aks-platform # <project>/<repo>
      ref: refs/tags/v1.1.0 # platform release; this one ref pins both the template and the Terraform code

# With an Exclusive Lock check on the environments, a newer run waits for the current one instead of overlapping it
lockBehavior: sequential

stages:
  - template: pipelines/provision.yml@platform
    parameters:
      environment: prod
      serviceConnection: sc-aks-myapp-prod
      stateResourceGroup: rg-tfstate-prod
      stateStorageAccount: sttfstateprod001
      stateKeyPrefix: my-org/azure-aks-customer/prod # same key the GitHub workflow used; never change it after the first apply
      destroyApprovers: '[MyProject]\AKS-Platform-Admins'
      pool:
        name: aks-private-agents
      planOnly: ${{ parameters.planOnly }}

  # Another environment: copy environments/prod to environments/<env> and add a block like the one above.
  # - template: pipelines/provision.yml@platform
  #   parameters:
  #     environment: dev
  #     ...
